  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#background)"/>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="192" y="430" width="536" height="340" rx="70" fill="#a0d8ff" fill-opacity="0.55"/>
    <rect x="280" y="262" width="536" height="386" rx="70" fill="url(#panel)"/>
    <path d="M280 354H816" stroke="#527bbc" stroke-opacity="0.18" stroke-width="12"/>
    <circle cx="334" cy="308" r="10" fill="#527bbc" fill-opacity="0.5"/>
