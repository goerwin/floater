<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Floater - Floating panel</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#529bff"/>
      <stop offset="0.5" stop-color="#3869e9"/>
      <stop offset="1" stop-color="#253aa6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.1" r="0.9">
      <stop stop-color="#b3e8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b3e8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
